name: Engine tests and certificates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    # The published v3.3 engine (77 tests), the v3.3 + C7 package of v4.4 (97 tests since the v4.6.1 erratum), and that
    # package with the 32-pulse calendar of v4.5 applied (99 tests, including test_calendar32.py),
    # and with the 28-pulse, T = 230 calendar of v4.6 applied (101 tests, including test_calendar28.py).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [v3.3, v3.3+C7, v4.5-calendar32, v4.6-calendar28]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Locate the package
        run: |
          if [ "${{ matrix.package }}" = "v3.3" ]; then
            echo "PKG=$PWD/engine" >> "$GITHUB_ENV"
          else
            mkdir -p "$RUNNER_TEMP/c7"
            unzip -q sweep/v33_c7/A22_fresh_launch_v3_3_C7.zip -d "$RUNNER_TEMP/c7"
            PKG="$RUNNER_TEMP/c7/A22_fresh_launch_v3_3_C7"
            if [ "${{ matrix.package }}" = "v4.5-calendar32" ]; then
              patch -p1 -d "$PKG" < sweep/schedule32/calendar32.patch
              cp sweep/schedule32/test_calendar32.py "$PKG/tests/"
            elif [ "${{ matrix.package }}" = "v4.6-calendar28" ]; then
              patch -p1 -d "$PKG" < sweep/schedule28_T230/calendar28_T230.patch
              cp sweep/schedule28_T230/test_calendar28.py "$PKG/tests/"
            fi
            echo "PKG=$PKG" >> "$GITHUB_ENV"
          fi
      - name: Install the pinned dependencies
        run: python -m pip install -r "$PKG/requirements.txt"
      - name: Build the native extensions
        working-directory: ${{ env.PKG }}
        run: python build_all_native.py
      - name: Unit tests
        working-directory: ${{ env.PKG }}
        run: python -B -m unittest discover -s tests

  certificates:
    # Regenerates every committed certificate that needs no campaign output (initial
    # sections, future-wave certificates and their independent checks) and compares.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and compare
        run: python -I tools/check_certificates.py
