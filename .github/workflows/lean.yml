name: Lean (strict-root core)

on:
  push:
    paths:
      - 'proof/lean/**'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'proof/lean/**'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proof/lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Mathlib v4.35.0 and its dependencies
        # Mathlib is pinned by tag in lakefile.toml; its dependencies follow
        # Mathlib's own lake-manifest.json at that tag.
        run: |
          lake update
          cat lake-manifest.json
      - name: Fetch the prebuilt Mathlib cache
        run: lake exe cache get
      - name: Build
        run: lake build
      - name: Check the axioms (no sorryAx)
        run: |
          lake env lean StrictRoot.lean > axioms.log 2>&1
          cat axioms.log
          test "$(grep -c "depends on axioms" axioms.log)" -eq 6
          ! grep -q sorryAx axioms.log
